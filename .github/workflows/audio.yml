name: Upload audio to Roblox

# Когда меняются файлы в audio/ — заливает новые звуки в Roblox (Open Cloud Assets API),
# записывает их ID в src/shared/AudioIds.luau, коммитит и сразу публикует игру.
# Ключу ROBLOX_API_KEY нужно право Assets API (Read + Write).

on:
  push:
    branches: [main]
    paths: ["audio/**", "tools/upload_audio.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload new sounds
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "10771225083"
        run: python3 tools/upload_audio.py

      - name: Commit audio IDs
        run: |
          git config user.name "audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/ids.json src/shared/AudioIds.luau
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Audio IDs [auto]" && git pull --rebase && git push; fi

      - name: Install Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -q rojo.zip -d bin && chmod +x bin/rojo

      - name: Build place
        run: ./bin/rojo build default.project.json -o game.rbxl

      - name: Publish via Open Cloud
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "10771225083"
          PLACE_ID: "72560314175089"
        run: |
          status=$(curl -sS -o resp.json -w "%{http_code}" -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @game.rbxl)
          cat resp.json
          test "$status" = "200"
